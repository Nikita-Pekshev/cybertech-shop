<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTech: Register</title>
    <link rel="stylesheet" href="css/register.css">
    <link rel="icon" href="img/vecteezy_processor-vector-icon-design_16364525.svg">
</head>
<body>
    <div class="container">
        <div class="form-box" id="register-form">
            <form action="">
                <h2>Регистрация</h2>
                <div id="errorMessage" style="color: #e74c3c; background: #fde8e8; padding: 10px; border-radius: 6px; display: none; margin-bottom: 15px; font-size: 14px;"></div>
                <input type="text" id="username" placeholder="Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="register">Регистрация</button>
                <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
            </form>
        </div>
    </div>
        <script>
        // Конфигурация API
        const API_URL = 'http://localhost:5000/api';

        // Проверка авторизации
        function isAuthenticated() {
            return !!localStorage.getItem('token');
        }
    </script>
    
    <script>
        // Логика страницы регистрации
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ Страница регистрации загружена');
            
            // НАХОДИМ ЭЛЕМЕНТЫ
            const registerForm = document.getElementById('register-form');
            const errorDiv = document.getElementById('errorMessage');
            const usernameInput = document.getElementById('username');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            
            // ПРОВЕРЯЕМ ВСЕ ЭЛЕМЕНТЫ
            if (!registerForm) {
                console.error('❌ Форма с id="registerForm" не найдена!');
                return;
            }
            
            if (!errorDiv) {
                console.error('❌ Блок ошибок с id="errorMessage" не найден!');
                return;
            }
            
            if (!usernameInput) {
                console.error('❌ Поле с id="username" не найдено!');
                return;
            }
            
            if (!emailInput) {
                console.error('❌ Поле с id="email" не найдено!');
                return;
            }
            
            if (!passwordInput) {
                console.error('❌ Поле с id="password" не найдено!');
                return;
            }
            
            console.log('✅ Все элементы найдены');
            
            // Если пользователь уже авторизован - перенаправляем на главную
            if (isAuthenticated()) {
                console.log('Пользователь уже авторизован, перенаправляем...');
                window.location.href = 'index.html';
                return;
            }
            
            // ОБРАБОТЧИК ОТПРАВКИ ФОРМЫ
            registerForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                console.log('📝 Попытка регистрации...');
                
                const username = usernameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                
                errorDiv.style.display = 'none';
                
                if (!username || !email || !password) {
                    showError('Заполните все поля');
                    return;
                }
                
                if (username.length < 3) {
                    showError('Имя пользователя должно содержать минимум 3 символа');
                    return;
                }
                
                if (password.length < 6) {
                    showError('Пароль должен содержать минимум 6 символов');
                    return;
                }
                
                try {
                    console.log('Отправка данных на сервер:', { username, email, password: '***' });
                    
                    const response = await fetch(`${API_URL}/auth/register`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, email, password })
                    });
                    
                    const data = await response.json();
                    console.log('Ответ сервера:', data);
                    
                    if (response.ok) {
                        alert('✅ Регистрация успешна! Теперь войдите в систему.');
                        console.log('✅ Регистрация успешна! Перенаправление на login...');
                        window.location.href = 'login.html';
                    } else {
                        showError(data.error || 'Ошибка регистрации');
                    }
                } catch (error) {
                    console.error('❌ Ошибка регистрации:', error);
                    showError('❌ Ошибка соединения с сервером. Убедитесь, что сервер запущен (python app.py)');
                }
            });
            
            function showError(message) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                console.log('❌ Ошибка:', message);
            }
        });
    </script>
</body>
</html>
