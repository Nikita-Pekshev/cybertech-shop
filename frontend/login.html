<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTech: Login</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" href="img/vecteezy_processor-vector-icon-design_16364525.svg">
</head>
<body>
    <div class="container">
        <div class="form-box active" id="login-form">
            <form action="">
                <h2>Войти</h2>
                <div id="errorMessage" style="color: #e74c3c; background: #fde8e8; padding: 10px; border-radius: 6px; display: none; margin-bottom: 15px; font-size: 14px;"></div>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="login">Войти</button>
                <p>У вас нет аккаунта? <a href="register.html">Регистрация</a></p>
            </form>
        </div>
    </div>
<script>
        const API_URL = 'http://localhost:5000/api';

        function getToken() {
            return localStorage.getItem('token');
        }

        function setToken(token) {
            localStorage.setItem('token', token);
        }

        function isAuthenticated() {
            return !!getToken();
        }
    </script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ Страница входа загружена');
            
            const loginForm = document.getElementById('login-form');
            const errorDiv = document.getElementById('errorMessage');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            
            if (!loginForm) {
                console.error('❌ Форма с id="loginForm" не найдена!');
                return;
            }
            
            if (!errorDiv) {
                console.error('❌ Блок ошибок с id="errorMessage" не найден!');
                return;
            }
            
            if (!emailInput) {
                console.error('❌ Поле с id="email" не найдено!');
                return;
            }
            
            if (!passwordInput) {
                console.error('❌ Поле с id="password" не найдено!');
                return;
            }
            
            console.log('✅ Все элементы найдены');
            
            if (isAuthenticated()) {
                console.log('Пользователь уже авторизован, перенаправляем...');
                window.location.href = 'index.html';
                return;
            }
            
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                console.log('🔑 Попытка входа...');
                
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                
                errorDiv.style.display = 'none';
                
                if (!email || !password) {
                    showError('Заполните все поля');
                    return;
                }
                
                try {
                    console.log('Отправка запроса на сервер...');
                    
                    const response = await fetch(`${API_URL}/auth/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const data = await response.json();
                    console.log('Ответ сервера:', data);
                    
                    if (response.ok) {
                        setToken(data.token);
                        console.log('✅ Вход выполнен успешно!');
                        window.location.href = 'index.html';
                    } else {
                        showError(data.error || 'Неверный email или пароль');
                    }
                } catch (error) {
                    console.error('❌ Ошибка входа:', error);
                    showError('❌ Ошибка соединения с сервером. Убедитесь, что сервер запущен (python app.py)');
                }
            });
            
            function showError(message) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                console.log('❌ Ошибка:', message);
            }
        });
    </script>
</body>
</html>
