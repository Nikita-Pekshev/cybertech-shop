<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTech - Админ панель</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" href="img/vecteezy_processor-vector-icon-design_16364525.svg">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html" id="logoLink">CyberTech</a>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Поиск товаров...">
            <button class="search-button">Поиск</button>
        </div>
        <ul class="nav-link">
            <li><a href="index.html">На сайт</a></li>
            <li><a href="cart.html" id="cartLink"> Корзина (0)</a></li>
            <li><a href="favorite.html" id="favoritesLink"> Избранное</a></li>
            <li id="login-item"><a href="login.html">Войти</a></li>
        </ul>
    </nav>

    <div class="category-header">
        <h2>⚙️ Админ панель</h2>
    </div>

    <div class="container2">
        <!-- Кнопка добавления -->
        <button class="add-btn" onclick="showAddForm()">➕ Добавить товар</button>

        <!-- Таблица товаров -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Категория</th>
                        <th>Цена</th>
                        <th>Производитель</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    <tr><td colspan="7">⏳ Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Модальное окно для добавления/редактирования -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Добавить товар</h2>
            <form id="productForm">
                <input type="hidden" id="editProductId">
                
                <div class="form-group">
                    <label>Название *</label>
                    <input type="text" id="productName" required>
                </div>
                
                <div class="form-group">
                    <label>Категория *</label>
                    <select id="productCategory" required></select>
                </div>
                
                <div class="form-group">
                    <label>Цена *</label>
                    <input type="number" id="productPrice" step="0.01" required>
                </div>
                
                <div class="form-group">
                    <label>Производитель</label>
                    <input type="text" id="productManufacturer">
                </div>            
                <div class="form-group">
                    <label>URL картинки</label>
                    <input type="text" id="productImage" placeholder="https://example.com/image.jpg">
                </div>
                
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="productDescription" rows="3"></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="save-btn"> Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
