<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTech:Корзина</title>
    <link rel="stylesheet" href="css/cart.css">
    <link rel="icon" href="img/vecteezy_processor-vector-icon-design_16364525.svg">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html" id="logoLink">CyberTech</a>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Поиск товаров...">
            <button class="search-button">Поиск</button>
        </div>
        <ul class="nav-link">
            <li class="catalog">
                <a href="#">Каталог</a>
                <ul class="dropout">
                    <li><a href="index.html" data-category="1">Бытовая техника</a></li>
                    <li><a href="index.html" data-category="2">Смартфоны</a></li>
                    <li><a href="index.html" data-category="3">ПК, ноутбуки, периферия</a></li>
                    <li><a href="index.html" data-category="4">Сетевое оборудование</a></li>
                </ul>
            </li>
            <li><a href="cart.html" id="cartLink">Корзина (0)</a></li>
            <li><a href="favorite.html" id="favoritesLink">Избранное</a></li>
            <li id="login-item"><a href="login.html">Войти</a></li>
        </ul>
    </nav>

    <div class="category-header">
        <h2 id="categoryTitle">Корзина</h2>
    </div>

    <div class="container2">
        <!-- ВКЛАДКИ -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="cart" onclick="switchTab('cart')">
                 Корзина 
            </button>
            <button class="tab-btn" data-tab="orders" onclick="switchTab('orders')">
                 Мои заказы 
            </button>
        </div>

        <!-- КОНТЕНТ КОРЗИНЫ -->
        <div id="cartContent" class="tab-content">
            <div class="loading-message">⏳ Загрузка корзины...</div>
        </div>

        <!-- КОНТЕНТ ЗАКАЗОВ -->
        <div id="ordersContent" class="tab-content" style="display: none;">
            <div class="loading-message">⏳ Загрузка заказов...</div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
